[project]
name = "fit-my-ride"
version = "0.1.0"
description = "Match a rider's body measurements against vendor bike geometry."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pdfplumber",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fit_my_ride"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# BMad installer tooling, not project code
extend-exclude = ["_bmad", "_bmad-output"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
