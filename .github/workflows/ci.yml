name: CI

on:
  push:
    # Feature branches run via their pull request; only main runs on push.
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Same commands as .pre-commit-config.yaml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
